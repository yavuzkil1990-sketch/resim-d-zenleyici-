<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Malın Resim Düzenleyicisi - PowerPoint Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #f3f3f3;
    color: #323130;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Üst başlık çubuğu (PowerPoint gibi) */
  .titlebar {
    background: #b7472a;
    color: white;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .titlebar span { opacity: 0.9; }

  /* Ribbon */
  .ribbon {
    background: #f3f3f3;
    border-bottom: 1px solid #d1d1d1;
    flex-shrink: 0;
  }
  .ribbon-tabs {
    display: flex;
    background: #f3f3f3;
    border-bottom: 1px solid #e1e1e1;
    padding: 0 8px;
  }
  .ribbon-tab {
    padding: 8px 16px;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    color: #323130;
  }
  .ribbon-tab.active {
    border-bottom-color: #b7472a;
    font-weight: 600;
    background: white;
  }
  .ribbon-content {
    background: white;
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    border-bottom: 1px solid #e1e1e1;
  }

  /* Butonlar */
  button, label.btn {
    background: #ffffff;
    border: 1px solid #d1d1d1;
    color: #323130;
    padding: 6px 11px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 12px;
    transition: 0.1s;
    user-select: none;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  button:hover, label.btn:hover {
    background: #f5f5f5;
    border-color: #b7472a;
  }
  button:active { background: #e8e8e8; }
  button.active {
    background: #fce4d6;
    border-color: #b7472a;
    color: #b7472a;
  }
  input[type="file"] { display: none; }

  /* Kontroller */
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    padding: 6px 12px;
    background: #fafafa;
    border-bottom: 1px solid #e1e1e1;
    font-size: 12px;
  }
  .controls-row label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  input[type="range"] {
    width: 90px;
    accent-color: #b7472a;
  }
  input[type="color"] {
    width: 32px;
    height: 26px;
    border: 1px solid #d1d1d1;
    border-radius: 2px;
    padding: 1px;
    cursor: pointer;
    background: white;
  }

  /* Çalışma alanı */
  #workspace {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: auto;
    padding: 16px;
    background: #e5e5e5;
    position: relative;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    background: white;
    touch-action: none;
  }

  /* Alt durum çubuğu */
  .statusbar {
    padding: 5px 14px;
    font-size: 11px;
    color: #605e5c;
    background: #f3f3f3;
    border-top: 1px solid #d1d1d1;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
  }

  /* Renk presetleri */
  .color-presets {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .color-preset {
    width: 20px;
    height: 20px;
    border-radius: 2px;
    border: 1px solid #ccc;
    cursor: pointer;
  }
  .color-preset:hover { transform: scale(1.15); }
</style>
</head>
<body>

<div class="titlebar">
  <div>Malın Resim Düzenleyicisi</div>
  <span>PowerPoint ruhuyla</span>
</div>

<div class="ribbon">
  <div class="ribbon-tabs">
    <div class="ribbon-tab active">Giriş</div>
    <div class="ribbon-tab">Düzenle</div>
  </div>
  <div class="ribbon-content">
    <label class="btn">
      📂 Resim Yükle
      <input type="file" id="fileInput" accept="image/*">
    </label>
    <button id="btnCrop">✂️ Kırp</button>
    <button id="btnDraw">✏️ Çiz</button>
    <button id="btnEraser">🧽 Silgi</button>
    <button id="btnRotate">🔄 90°</button>
    <button id="btnUndo">↩️ Geri</button>
    <button id="btnRedo">↪️ İleri</button>
    <button id="btnReset">🔄 Sıfırla</button>
    <button id="btnDownload">💾 PNG İndir</button>
  </div>
</div>

<div class="controls-row">
  <label>Parlaklık <input type="range" id="brightness" min="-100" max="100" value="0"></label>
  <label>Kontrast <input type="range" id="contrast" min="-100" max="100" value="0"></label>
  <button id="btnGray">Gri Ton</button>
  <button id="btnSepia">Sepia</button>
  <button id="btnClearFilter">Filtre Temizle</button>

  <label>Fırça <input type="range" id="brushSize" min="1" max="60" value="8"></label>

  <label>Renk 
    <input type="color" id="brushColor" value="#e74c3c">
  </label>

  <div class="color-presets">
    <div class="color-preset" style="background:#e74c3c" data-color="#e74c3c"></div>
    <div class="color-preset" style="background:#3498db" data-color="#3498db"></div>
    <div class="color-preset" style="background:#2ecc71" data-color="#2ecc71"></div>
    <div class="color-preset" style="background:#f1c40f" data-color="#f1c40f"></div>
    <div class="color-preset" style="background:#9b59b6" data-color="#9b59b6"></div>
    <div class="color-preset" style="background:#000000" data-color="#000000"></div>
    <div class="color-preset" style="background:#ffffff; border:1px solid #999" data-color="#ffffff"></div>
  </div>
</div>

<div id="workspace">
  <canvas id="canvas"></canvas>
</div>

<div class="statusbar">
  <span id="info">Resim yükle amına kodumun malı.</span>

</div>

const fileInput = document.getElementById('fileInput');
const info = document.getElementById('info');

let originalImage = null;
let currentBase = null;
let history = [];
let historyIndex = -1;

let mode = null;
let isDrawing = false;
let lastX = 0, lastY = 0;
let cropStart = null;
let cropEnd = null;
let cropSnapshot = null;

let brightness = 0;
let contrast = 0;
let brushColor = '#e74c3c';

function saveState() {
  if (historyIndex < history.length - 1) {
    history = history.slice(0, historyIndex + 1);
  }
  history.push(canvas.toDataURL('image/png'));
  historyIndex++;
  if (history.length > 25) {
    history.shift();
    historyIndex--;
  }
}

function loadState(index) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      resolve();
    };
    img.src = history[index];
  });
}

function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if (e.touches && e.touches.length) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function setMode(newMode) {
  mode = (mode === newMode) ? null : newMode;
  document.getElementById('btnDraw').classList.toggle('active', mode === 'draw');
  document.getElementById('btnEraser').classList.toggle('active', mode === 'erase');
  document.getElementById('btnCrop').classList.toggle('active', mode === 'crop');

    info.textContent = 'Kırpmak istediğin alanı sürükle, bırakınca kırpar';
  } else if (mode === 'draw') {
    info.textContent = 'Çizim modu açık – renk seçebilirsin';
  } else if (mode === 'erase') {
    info.textContent = 'Silgi açık';
  } else {
    info.textContent = originalImage ? `${canvas.width} × ${canvas.height} px` : 'Resim yükle amına kodumun malı.';
  }
}

// ---------- Filtreler ----------
function applyBrightnessContrast() {
  if (!currentBase) return;

  const temp = document.createElement('canvas');
  temp.width = canvas.width;
  temp.height = canvas.height;
  const tctx = temp.getContext('2d');
  tctx.drawImage(currentBase, 0, 0);

  const imageData = tctx.getImageData(0, 0, temp.width, temp.height);
  const data = imageData.data;
  const b = brightness / 100;
  const c = (contrast + 100) / 100;

    r = ((r / 255 - 0.5) * c + 0.5 + b) * 255;

    data[i+1] = Math.min(255, Math.max(0, g));
    data[i+2] = Math.min(255, Math.max(0, bl));
  }
  tctx.putImageData(imageData, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(temp, 0, 0);
}

function updateCurrentBase() {
  currentBase = new Image();
  currentBase.src = canvas.toDataURL('image/png');
}

// ---------- Dosya yükleme ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      originalImage = img;
      currentBase = img;
      history = [];
      historyIndex = -1;
      brightness = contrast = 0;
      document.getElementById('brightness').value = 0;
      document.getElementById('contrast').value = 0;
      saveState();
      setMode(null);
      info.textContent = `${img.width} × ${img.height} px`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ---------- Kontroller ----------
document.getElementById('brightness').addEventListener('input', e => {
  brightness = +e.target.value;
  applyBrightnessContrast();
});
document.getElementById('contrast').addEventListener('input', e => {
  contrast = +e.target.value;
  applyBrightnessContrast();
});

document.getElementById('btnGray').onclick = () => {
  if (!originalImage) return;

    const avg = (data[i] + data[i+1] + data[i+2]) / 3;
    data[i] = data[i+1] = data[i+2] = avg;
  }
  ctx.putImageData(imageData, 0, 0);
  updateCurrentBase();
  saveState();
};
