<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Malın Resim Düzenleyicisi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0f0f13;
    color: #e7eef8;
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 10px 16px;
    background: #16161d;
    border-bottom: 1px solid #2a2a35;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  h1 { font-size: 16px; font-weight: 600; }
  .toolbar, .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
    background: #121218;
    border-bottom: 1px solid #2a2a35;
    flex-shrink: 0;
  }
  .controls { background: #0f0f13; }
  button, label.btn {
    background: #1e1e28;
    border: 1px solid #333;
    color: #e7eef8;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: 0.12s;
    user-select: none;
    white-space: nowrap;
  }
  button:hover, label.btn:hover { background: #2a2a38; }
  button:active { transform: scale(0.96); }
  button.active { background: #3b3b50; border-color: #e7c27a; color: #e7c27a; }
  input[type="file"] { display: none; }
  .controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  input[type="range"] {
    width: 90px;
    accent-color: #e7c27a;
  }
  #workspace {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: auto;
    padding: 12px;
    background: #0a0a0e;
    position: relative;
  }
  canvas {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 0 30px rgba(0,0,0,0.7);
    background: #111;
    touch-action: none;
  }
  .info {
    padding: 6px 14px;
    font-size: 11px;
    color: #777;
    background: #121218;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <h1>Malın Resim Düzenleyicisi</h1>
  <span style="font-size:11px;color:#555">düzeltilmiş versiyon</span>
</header>

<div class="toolbar">
  <label class="btn">
    Resim Yükle
    <input type="file" id="fileInput" accept="image/*">
  </label>
  <button id="btnCrop">Kırp</button>
  <button id="btnDraw">Çiz</button>
  <button id="btnEraser">Silgi</button>
  <button id="btnRotate">90°</button>
  <button id="btnUndo">Geri</button>
  <button id="btnRedo">İleri</button>
  <button id="btnReset">Sıfırla</button>
  <button id="btnDownload">PNG İndir</button>
</div>

<div class="controls">
  <label>Parlaklık <input type="range" id="brightness" min="-100" max="100" value="0"></label>
  <label>Kontrast <input type="range" id="contrast" min="-100" max="100" value="0"></label>
  <button id="btnGray">Gri</button>
  <button id="btnSepia">Sepia</button>
  <button id="btnClearFilter">Filtre Temizle</button>
  <label>Fırça <input type="range" id="brushSize" min="1" max="50" value="8"></label>
</div>

<div id="workspace">
<div class="canvas-container"><canvas id="canvas"></canvas></div>
</div>

<div class="info" id="info">Resim yükle amına kodumun malı.</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const fileInput = document.getElementById('fileInput');
const info = document.getElementById('info');

let originalImage = null;      // ilk yüklenen resim
let currentBase = null;        // filtreler uygulanmadan önceki son hali
let history = [];
let historyIndex = -1;

let mode = null; // null | 'draw' | 'erase' | 'crop'
let isDrawing = false;
let lastX = 0, lastY = 0;
let cropStart = null;
let cropEnd = null;

let brightness = 0;
let contrast = 0;

// ---------- Yardımcılar ----------
function saveState() {
  if (historyIndex < history.length - 1) {
    history = history.slice(0, historyIndex + 1);
  }
  history.push(canvas.toDataURL('image/png'));
  historyIndex++;
  if (history.length > 25) {
    history.shift();
    historyIndex--;
  }
}

function loadState(index) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);
      resolve();
    };
    img.src = history[index];
  });
}

function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if (e.touches && e.touches.length) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function setMode(newMode) {
  mode = (mode === newMode) ? null : newMode;
  document.getElementById('btnDraw').classList.toggle('active', mode === 'draw');
  document.getElementById('btnEraser').classList.toggle('active', mode === 'erase');
  document.getElementById('btnCrop').classList.toggle('active', mode === 'crop');

  if (mode === 'crop') {
    info.textContent = 'Kırpmak istediğin alanı sürükle, bırakınca kırpar';
  } else if (mode === 'draw') {
    info.textContent = 'Çizim modu açık';
  } else if (mode === 'erase') {
    info.textContent = 'Silgi açık';
  } else {
    info.textContent = originalImage ? `${canvas.width} × ${canvas.height} px` : 'Resim yükle amına kodumun malı.';
  }
}

// ---------- Filtreler ----------
function applyBrightnessContrast() {
  if (!currentBase) return;

  const temp = document.createElement('canvas');
  temp.width = canvas.width;
  temp.height = canvas.height;
  const tctx = temp.getContext('2d');
  tctx.drawImage(currentBase, 0, 0);

  const imageData = tctx.getImageData(0, 0, temp.width, temp.height);
  const data = imageData.data;
  const b = brightness / 100;
  const c = (contrast + 100) / 100;

  for (let i = 0; i < data.length; i += 4) {
    let r = data[i], g = data[i+1], bl = data[i+2];
    r = ((r / 255 - 0.5) * c + 0.5 + b) * 255;
    g = ((g / 255 - 0.5) * c + 0.5 + b) * 255;
    bl = ((bl / 255 - 0.5) * c + 0.5 + b) * 255;
    data[i]   = Math.min(255, Math.max(0, r));
    data[i+1] = Math.min(255, Math.max(0, g));
    data[i+2] = Math.min(255, Math.max(0, bl));
  }
  tctx.putImageData(imageData, 0, 0);

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(temp, 0, 0);
}

function updateCurrentBase() {
  currentBase = new Image();
  currentBase.src = canvas.toDataURL('image/png');
}

// ---------- Dosya yükleme ----------
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      originalImage = img;
      currentBase = img;
      history = [];
      historyIndex = -1;
      brightness = contrast = 0;
      document.getElementById('brightness').value = 0;
      document.getElementById('contrast').value = 0;
      saveState();
      setMode(null);
      info.textContent = `${img.width} × ${img.height} px`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

// ---------- Kontroller ----------
document.getElementById('brightness').addEventListener('input', e => {
  brightness = +e.target.value;
  applyBrightnessContrast();
});
document.getElementById('contrast').addEventListener('input', e => {
  contrast = +e.target.value;
  applyBrightnessContrast();
});

document.getElementById('btnGray').onclick = () => {
  if (!originalImage) return;
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const avg = (data[i] + data[i+1] + data[i+2]) / 3;
    data[i] = data[i+1] = data[i+2] = avg;
  }
  ctx.putImageData(imageData, 0, 0);
  updateCurrentBase();
  saveState();
};

document.getElementById('btnSepia').onclick = () => {
  if (!originalImage) return;
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    data[i]   = Math.min(255, r * 0.393 + g * 0.769 + b * 0.189);
    data[i+1] = Math.min(255, r * 0.349 + g * 0.686 + b * 0.168);
    data[i+2] = Math.min(255, r * 0.272 + g * 0.534 + b * 0.131);
  }
  ctx.putImageData(imageData, 0, 0);
  updateCurrentBase();
  saveState();
};

document.getElementById('btnClearFilter').onclick = () => {
  brightness = 0;
  contrast = 0;
  document.getElementById('brightness').value = 0;
  document.getElementById('contrast').value = 0;
  if (currentBase) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(currentBase, 0, 0);
    saveState();
  }
};

document.getElementById('btnRotate').onclick = async () => {
  if (!originalImage) return;
  const temp = document.createElement('canvas');
  temp.width = canvas.height;
  temp.height = canvas.width;
  const tctx = temp.getContext('2d');
  tctx.translate(temp.width / 2, temp.height / 2);
  tctx.rotate(Math.PI / 2);
  tctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);

  canvas.width = temp.width;
  canvas.height = temp.height;
  ctx.drawImage(temp, 0, 0);

  updateCurrentBase();
  saveState();
  info.textContent = `${canvas.width} × ${canvas.height} px`;
};

document.getElementById('btnUndo').onclick = async () => {
  if (historyIndex > 0) {
    historyIndex--;
    await loadState(historyIndex);
    updateCurrentBase();
  }
};
document.getElementById('btnRedo').onclick = async () => {
  if (historyIndex < history.length - 1) {
    historyIndex++;
    await loadState(historyIndex);
    updateCurrentBase();
  }
};
document.getElementById('btnReset').onclick = () => {
  if (!originalImage) return;
  canvas.width = originalImage.width;
  canvas.height = originalImage.height;
  ctx.drawImage(originalImage, 0, 0);
  currentBase = originalImage;
  brightness = contrast = 0;
  document.getElementById('brightness').value = 0;
  document.getElementById('contrast').value = 0;
  history = [];
  historyIndex = -1;
  saveState();
  setMode(null);
  info.textContent = `${canvas.width} × ${canvas.height} px`;
};

document.getElementById('btnDownload').onclick = () => {
  if (!originalImage) return;
  const link = document.createElement('a');
  link.download = 'duzenlenmis-resim.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
};

// ---------- Mod butonları ----------
document.getElementById('btnDraw').onclick = () => setMode('draw');
document.getElementById('btnEraser').onclick = () => setMode('erase');
document.getElementById('btnCrop').onclick = () => setMode('crop');

// ---------- Pointer olayları (mouse + touch) ----------
function startPointer(e) {
  e.preventDefault();
  if (!originalImage) return;

  const pos = getPointerPos(e);

  if (mode === 'draw' || mode === 'erase') {
    isDrawing = true;
    lastX = pos.x;
    lastY = pos.y;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
  } else if (mode === 'crop') {
    cropStart = pos;
    cropEnd = null;
  }
}

function movePointer(e) {
  e.preventDefault();
  if (!originalImage) return;
  const pos = getPointerPos(e);

  if ((mode === 'draw' || mode === 'erase') && isDrawing) {
    ctx.lineWidth = +document.getElementById('brushSize').value;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (mode === 'erase') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.strokeStyle = 'rgba(0,0,0,1)';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = '#e7c27a';
    }

    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
  } else if (mode === 'crop' && cropStart) {
    cropEnd = pos;
    // Önizleme için history'den geri yükle + dikdörtgen çiz
    loadState(historyIndex).then(() => {
      if (!cropStart || !cropEnd) return;
      ctx.strokeStyle = '#e7c27a';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(
        Math.min(cropStart.x, cropEnd.x),
        Math.min(cropStart.y, cropEnd.y),
        Math.abs(cropEnd.x - cropStart.x),
        Math.abs(cropEnd.y - cropStart.y)
      );
      ctx.setLineDash([]);
    });
  }
}

function endPointer(e) {
  e.preventDefault();

  if ((mode === 'draw' || mode === 'erase') && isDrawing) {
    isDrawing = false;
    ctx.globalCompositeOperation = 'source-over';
    updateCurrentBase();
    saveState();
  } else if (mode === 'crop' && cropStart && cropEnd) {
    const x = Math.min(cropStart.x, cropEnd.x);
    const y = Math.min(cropStart.y, cropEnd.y);
    const w = Math.abs(cropEnd.x - cropStart.x);
    const h = Math.abs(cropEnd.y - cropStart.y);

    if (w > 8 && h > 8) {
      const imageData = ctx.getImageData(x, y, w, h);
      canvas.width = w;
      canvas.height = h;
      ctx.putImageData(imageData, 0, 0);
      updateCurrentBase();
      saveState();
      info.textContent = `${w} × ${h} px (kırpıldı)`;
    }
    cropStart = cropEnd = null;
    setMode(null);
  }
}

// Mouse
canvas.addEventListener('mousedown', startPointer);
canvas.addEventListener('mousemove', movePointer);
canvas.addEventListener('mouseup', endPointer);
canvas.addEventListener('mouseleave', endPointer);

// Touch
canvas.addEventListener('touchstart', startPointer, { passive: false });
canvas.addEventListener('touchmove', movePointer, { passive: false });
canvas.addEventListener('touchend', endPointer, { passive: false });
canvas.addEventListener('touchcancel', endPointer, { passive: false });
</script>
</body>
</html>
